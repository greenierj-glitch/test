<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matelski Grounds & Gardens</title>

<link rel="stylesheet" href="cssstyle.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="hero">
    <img src="rylan.jpg" alt="Rylan Matelski">
    <h1>MATELSKI</h1>
    <p>Premium Grounds & Outdoor Craftsmanship</p>
    <a href="#contact" class="btn">Request quote</a>
  </div>
</header>

<section class="services">
  <h2 class="title">Our Services</h2>

  <div class="grid">
    <div class="card">🌱 Lawn Care</div>
    <div class="card">🌿 Landscaping</div>
    <div class="card">🪵 Mulching</div>
    <div class="card">💦 Pressure Washing</div>
  </div>
</section>

<section class="before-after">

  <h2 class="title">Transformations</h2>

  <div class="grid">

    <div class="ba">
      <img src="before1.jpg">
      <div class="after"><img src="after1.jpg"></div>
      <input type="range" min="0" max="100" value="50" oninput="sync(this)">
    </div>

    <div class="ba">
      <img src="assets/images/before2.jpg">
      <div class="after"><img src="assets/images/after2.jpg"></div>
      <input type="range" min="0" max="100" value="50" oninput="sync(this)">
    </div>

    <div class="ba">
      <img src="assets/images/before3.jpg">
      <div class="after"><img src="assets/images/after3.jpg"></div>
      <input type="range" min="0" max="100" value="50" oninput="sync(this)">
    </div>

  </div>

</section>

<section id="contact" class="contact">
  <h2>Contact Us</h2>
  <p>(906) 869-3553</p>
  <p>matelskirylan@gmail.com</p>
</section>

<script src="js.js"></script>

</body>
</html>
